# tmuxウィンドウ名 絵文字アイコン定義（共通設定）
# Python / Shell 両方から参照される Single Source of Truth
# Pythonからはtmux_emoji.pyを経由してインポートする

# AI識別子
EMOJI_ID_CLAUDE=✴️
EMOJI_ID_GEMINI=💎
EMOJI_ID_CODEX=🪷

# フックステータス
EMOJI_STATUS_COMPLETED=✅
EMOJI_STATUS_ERROR=❌
EMOJI_STATUS_NOTIFICATION=✋
# 画面が一定時間変化しないコマンド（入力待ちの推測。確実な✋とは区別する）
EMOJI_STATUS_IDLE=⏸️
EMOJI_STATUS_ONGOING=🤖
EMOJI_STATUS_REVIEW=🔍

# 独立バッジ
EMOJI_CONTEXT_ALERT=⚠️
