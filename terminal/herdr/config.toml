onboarding = false

[theme]
name = "terminal"

[terminal]
default_shell = "zsh"
shell_mode = "auto"
new_cwd = "follow"

[update]
version_check = true
manifest_check = true

[keys]
prefix = "ctrl+t"

# Navigate-mode (goto) movement: keep default j/k and add emacs-style ctrl+n/ctrl+p
navigate_pane_up = ["k", "ctrl+p"]
navigate_pane_down = ["j", "ctrl+n"]

# workspace operations (shift modifier); tab operations keep their unmodified defaults
next_workspace = "prefix+shift+n"
previous_workspace = "prefix+shift+p"
new_workspace = "prefix+shift+c"
switch_workspace = "prefix+shift+1..9"
open_worktree = "prefix+shift+o"

# agent operations (ctrl modifier)
focus_agent = "prefix+ctrl+1..9"
next_agent = "prefix+ctrl+n"
previous_agent = "prefix+ctrl+p"

[[keys.command]]
key = "prefix+ctrl+g"
type = "popup"
command = "zsh -ilc \"XDG_CONFIG_HOME=\\\"$HOME/.config\\\" lazygit\""
description = "run lazygit"
width = "99%"
height = "99%"

[[keys.command]]
key = "prefix+ctrl+shift+g"
type = "popup"
command = "zsh -ic \"dia\""
description = "run difit"
width = "90%"
height = "80%"

[[keys.command]]
key = "prefix+f"
type = "popup"
command = "$HOME/.tmux/scripts/tmux-file-picker.sh"
description = "file picker (@path insert when AI agent detected)"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+t"
type = "popup"
command = "zsh"
description = "open shell popup"
width = "99%"
height = "99%"

[[keys.command]]
key = "prefix+shift+f"
type = "popup"
command = "zsh -ilc \"frws\""
description = "worktree picker -> new workspace"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+ctrl+s"
type = "shell"
command = "bash -lc 'src=\"$HERDR_ACTIVE_PANE_ID\"; out=$(herdr pane split --pane \"$src\" --direction down --ratio 0.5 --focus); new=$(echo \"$out\" | jq -r .result.pane.pane_id); marker=\"__herdr_ready_${$}_${RANDOM}__\"; herdr pane run \"$new\" \"echo $marker\"; herdr wait output \"$new\" --match \"$marker\" --source recent --timeout 15000 >/dev/null 2>&1; herdr pane run \"$new\" \"herdr pane read $src --source recent --lines 5000 --format text | less -R +G\"'"
description = "snapshot current pane output -> down split"

[[keys.command]]
key = "prefix+ctrl+v"
type = "shell"
command = "bash -lc 'src=\"$HERDR_ACTIVE_PANE_ID\"; out=$(herdr pane split --pane \"$src\" --direction right --ratio 0.5 --focus); new=$(echo \"$out\" | jq -r .result.pane.pane_id); marker=\"__herdr_ready_${$}_${RANDOM}__\"; herdr pane run \"$new\" \"echo $marker\"; herdr wait output \"$new\" --match \"$marker\" --source recent --timeout 15000 >/dev/null 2>&1; herdr pane run \"$new\" \"herdr pane read $src --source recent --lines 5000 --format text | less -R +G\"'"
description = "snapshot current pane output -> right split"

[[keys.command]]
key = "prefix+shift+v"
type = "popup"
command = "zsh -ilc \"$HOME/.tmux/scripts/open-pr-web.sh\""
description = "open current branch's PR in browser"
width = "90%"
height = "80%"

[ui]
mouse_capture = true
copy_on_select = true
confirm_close = true
pane_borders = true

show_agent_labels_on_pane_borders = true

[ui.sidebar.spaces]
# state_icon: Herdr組み込みのAI状態。$shell_status: herdr_status_icon.shが
# `workspace report-metadata --source shell-status --token shell_status=<emoji>`
# で書くAI以外のシェル状態（入力待ち✋・完了✅・失敗❌のOR集約、tmuxの
# @session_ai_status user optionと等価）。
rows = [["state_icon", "$shell_status", "workspace"], ["git_status", "branch"]]

[ui.toast]
# Rich Mac notifications now come from the notify-rich plugin (terminal/herdr/plugins/notify-rich),
# which reacts to pane.agent_status_changed; Herdr's own toast is disabled to avoid double notifications.
delivery = "off"
delay_seconds = 1

[ui.sound]
enabled = true

[session]
resume_agents_on_restore = true

[experimental]
pane_history = false
