onboarding = false

[theme]
name = "terminal"

[terminal]
default_shell = "zsh"
shell_mode = "auto"
new_cwd = "follow"

[update]
version_check = true
manifest_check = true

[keys]
prefix = "ctrl+t"

[[keys.command]]
key = "prefix+ctrl+g"
type = "popup"
command = "XDG_CONFIG_HOME=\"$HOME/.config\" lazygit"
description = "run lazygit"
width = "99%"
height = "99%"

[[keys.command]]
key = "prefix+ctrl+shift+g"
type = "popup"
command = "zsh -ic \"dia\""
description = "run difit"
width = "90%"
height = "80%"

[[keys.command]]
key = "prefix+@"
type = "popup"
command = "$HOME/.tmux/scripts/tmux-file-picker.sh"
description = "file picker (@path insert when AI agent detected)"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+t"
type = "popup"
command = "zsh"
description = "open shell popup"
width = "99%"
height = "99%"

[ui]
mouse_capture = true
copy_on_select = true
confirm_close = true
pane_borders = true

show_agent_labels_on_pane_borders = true
[ui.toast]
# Rich Mac notifications now come from the notify-rich plugin (terminal/herdr/plugins/notify-rich),
# which reacts to pane.agent_status_changed; Herdr's own toast is disabled to avoid double notifications.
delivery = "off"
delay_seconds = 1

[ui.sound]
enabled = true

[session]
resume_agents_on_restore = true

[experimental]
pane_history = false
