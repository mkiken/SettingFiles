onboarding = false

[theme]
name = "terminal"

[terminal]
default_shell = "zsh"
shell_mode = "auto"
new_cwd = "follow"

[update]
version_check = true
manifest_check = true

[keys]
prefix = "ctrl+t"

# Navigate-mode (goto) movement: keep default j/k and add emacs-style ctrl+n/ctrl+p
navigate_pane_up = ["k", "ctrl+p"]
navigate_pane_down = ["j", "ctrl+n"]

# workspace operations (shift modifier); tab operations keep their unmodified defaults
next_workspace = "prefix+shift+n"
previous_workspace = "prefix+shift+p"
new_workspace = "prefix+shift+c"
switch_workspace = "prefix+shift+1..9"
open_worktree = "prefix+shift+o"

# agent operations (alt modifier)
focus_agent = "prefix+alt+1..9"
next_agent = "prefix+alt+n"
previous_agent = "prefix+alt+p"

[[keys.command]]
key = "prefix+ctrl+g"
type = "popup"
command = "XDG_CONFIG_HOME=\"$HOME/.config\" lazygit"
description = "run lazygit"
width = "99%"
height = "99%"

[[keys.command]]
key = "prefix+ctrl+shift+g"
type = "popup"
command = "zsh -ic \"dia\""
description = "run difit"
width = "90%"
height = "80%"

[[keys.command]]
key = "prefix+@"
type = "popup"
command = "$HOME/.tmux/scripts/tmux-file-picker.sh"
description = "file picker (@path insert when AI agent detected)"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+t"
type = "popup"
command = "zsh"
description = "open shell popup"
width = "99%"
height = "99%"

[[keys.command]]
key = "prefix+ctrl+s"
type = "shell"
command = "bash -lc 'src=\"$HERDR_ACTIVE_PANE_ID\"; out=$(herdr pane split --pane \"$src\" --direction down --ratio 0.5 --focus); new=$(echo \"$out\" | jq -r .result.pane.pane_id); sleep 2; herdr pane run \"$new\" \"herdr pane read $src --source recent --lines 5000 --format text | less -R +G\"'"
description = "snapshot current pane output -> down split"

[[keys.command]]
key = "prefix+ctrl+v"
type = "shell"
command = "bash -lc 'src=\"$HERDR_ACTIVE_PANE_ID\"; out=$(herdr pane split --pane \"$src\" --direction right --ratio 0.5 --focus); new=$(echo \"$out\" | jq -r .result.pane.pane_id); sleep 2; herdr pane run \"$new\" \"herdr pane read $src --source recent --lines 5000 --format text | less -R +G\"'"
description = "snapshot current pane output -> right split"

[ui]
mouse_capture = true
copy_on_select = true
confirm_close = true
pane_borders = true

show_agent_labels_on_pane_borders = true
[ui.toast]
# Rich Mac notifications now come from the notify-rich plugin (terminal/herdr/plugins/notify-rich),
# which reacts to pane.agent_status_changed; Herdr's own toast is disabled to avoid double notifications.
delivery = "off"
delay_seconds = 1

[ui.sound]
enabled = true

[session]
resume_agents_on_restore = true

[experimental]
pane_history = false
