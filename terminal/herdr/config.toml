onboarding = false

[theme]
name = "terminal"

[terminal]
default_shell = "zsh"
shell_mode = "auto"
new_cwd = "follow"

[update]
version_check = true
manifest_check = true

[keys]
prefix = "ctrl+t"

# Navigate-mode (goto) movement: keep default j/k and add emacs-style ctrl+n/ctrl+p
navigate_pane_up = ["k", "ctrl+p"]
navigate_pane_down = ["j", "ctrl+n"]

# pane/workspace operations; `o` matches tmux next-pane
cycle_pane_next = "prefix+o"
next_workspace = "prefix+shift+n"
previous_workspace = "prefix+shift+p"
new_workspace = "prefix+shift+c"
switch_workspace = "prefix+shift+1..9"

# agent operations (ctrl modifier)
focus_agent = "prefix+ctrl+1..9"
next_agent = "prefix+ctrl+n"
previous_agent = "prefix+ctrl+p"

[[keys.command]]
key = "prefix+ctrl+g"
type = "popup"
command = "HERDR_POPUP_COMMAND=1 zsh -ilc 'exec bash \"$HOME/.tmux/scripts/herdr-open-lazygit.sh\"'"
description = "run lazygit"
width = "99%"
height = "99%"

[[keys.command]]
key = "prefix+ctrl+shift+g"
type = "popup"
command = "zsh -ic \"dia\""
description = "run difit"
width = "90%"
height = "80%"

[[keys.command]]
key = "prefix+f"
type = "popup"
command = "$HOME/.tmux/scripts/tmux-file-picker.sh"
description = "file picker (@path insert when AI agent detected)"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+t"
type = "popup"
command = "zsh -il"
description = "open shell popup"
width = "99%"
height = "99%"

[[keys.command]]
key = "prefix+shift+f"
type = "popup"
command = "HERDR_POPUP_COMMAND=1 zsh -ilc \"_herdr_pick_worktree_target\""
description = "worktree picker: Enter workspace, Ctrl-O tab, C-s down split, C-v right split"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+shift+g"
type = "popup"
command = "HERDR_POPUP_COMMAND=1 zsh -ilc 'source \"$HOME/.tmux/scripts/herdr-create-worktree-tab.sh\"'"
description = "create worktree -> new tab"
width = "60%"
height = "25%"

[[keys.command]]
key = "prefix+ctrl+s"
type = "shell"
command = "bash -lc '\"$HOME/.tmux/scripts/herdr-split-snapshot-pane.sh\" down'"
description = "snapshot current pane output -> down split"

[[keys.command]]
key = "prefix+ctrl+v"
type = "shell"
command = "bash -lc '\"$HOME/.tmux/scripts/herdr-split-snapshot-pane.sh\" right'"
description = "snapshot current pane output -> right split"

[[keys.command]]
key = "prefix+shift+v"
type = "popup"
command = "zsh -ilc \"$HOME/.tmux/scripts/open-pr-web.sh\""
description = "open current branch's PR in browser"
width = "90%"
height = "80%"

[[keys.command]]
key = "prefix+u"
type = "plugin_action"
command = "termscope.open-links"
description = "visible-screen link picker"

[[keys.command]]
# plugin_action 直呼びだと Herdr が PATH を剥ぎ取るため picker が zoxide/fzf を解決できない。
# ログインシェルを挟んで PATH を復元してから picker 本体へ橋渡しする。
key = "prefix+shift+o"
type = "popup"
command = "HERDR_POPUP_COMMAND=1 zsh -ilc '$HOME/.tmux/scripts/herdr-open-zoxide-picker.sh'"
description = "Browse zoxide directories"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+g"
type = "plugin_action"
command = "herdr-bar.open"
description = "command bar"

[ui]
mouse_capture = true
copy_on_select = true
confirm_close = true
pane_borders = true

show_agent_labels_on_pane_borders = true

agent_panel_sort = "priority"
[ui.sidebar.spaces]
# $shell_status: herdr_status_icon.shが書くシェル状態（入力待ち✋・完了✅・失敗❌）。
# AI状態はAgents sidebarだけに表示する。
rows = [["$shell_status", "workspace"], ["git_status", "branch"]]

[ui.sidebar.agents]
row_gap = 0
rows = [
  ["workspace", "tab"],
  ["state_icon", "agent", "state_text"],
]

[ui.sidebar.agents.rows_by_agent]
claude = [
  ["workspace", "tab"],
  ["state_icon", "$provider", "$limit", "state_text"],
  ["$context"],
  ["terminal_title_stripped"],
]
codex = [
  ["workspace", "tab"],
  ["state_icon", "$provider", "$limit", "state_text"],
  ["$context"],
]

[ui.toast]
# Disable all Herdr-delivered pop-up notifications, including notify-rich's API path.
delivery = "off"
delay_seconds = 1

[ui.sound]
enabled = true

[ui.sound.agents]
# Geminiはherdr公式インストーラー連携が無くagent_statusがdone<->working<->idleで
# 頻繁に振動するため、他agentに比べ音の発火回数が多くうるさい。Geminiだけ音を止める
# （tab rename/状態アイコン等サイドバー表示はagent別のOFF項目がherdrに存在しない）。
gemini = "off"

[session]
resume_agents_on_restore = true

[advanced]
# Retain long agent and command output instead of dropping it at the 10 MiB default.
scrollback_limit_bytes = 104857600

[experimental]
# Persist visible pane output across a Herdr server restart.
pane_history = true
