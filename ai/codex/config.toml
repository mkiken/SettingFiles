model = "gpt-6.1-terra"
approval_policy = 'on-request'
sandbox_mode = 'danger-full-access'
plan_mode_reasoning_effort = 'high'
suppress_unstable_features_warning = true
model_reasoning_effort = "medium"

[shell_environment_policy]
# Codex-spawned shell commands inherit this so notify() suppresses macOS notifications during AI runs.
set = { DISABLE_NOTIFY = "1" }

[features]
hooks = true
plugin_hooks = true
apps = false
terminal_resize_reflow = true
# Enable structured confirmation prompts in Default mode.
default_mode_request_user_input = true

[agents]
max_threads = 6
max_depth = 2

[mcp_servers]

[tui]
# Herdr owns Codex completion and input-request notifications.
notifications = false
alternate_screen = "never"
status_line = ['project-name', 'pull-request-number', 'git-branch', 'task-progress', 'context-used', 'used-tokens', 'context-window-size', 'five-hour-limit', 'weekly-limit', 'model-with-reasoning', 'workspace-headline']
status_line_use_colors = true

[tui.model_availability_nux]
'gpt-5.5' = 4

[hooks]

[marketplaces]

[marketplaces.ponytail]
source_type = "git"
source = "https://github.com/DietrichGebert/ponytail.git"

[plugins]

[plugins.'superpowers@openai-curated']
enabled = true

[plugins."ponytail@ponytail"]
enabled = true

