approval_policy = 'on-request'
sandbox_mode = 'danger-full-access'
plan_mode_reasoning_effort = 'xhigh'
suppress_unstable_features_warning = true

[shell_environment_policy]
# Codex-spawned shell commands inherit this so notify() suppresses macOS notifications during AI runs.
set = { DISABLE_NOTIFY = "1" }

[features]
hooks = true
plugin_hooks = true
apps = false
terminal_resize_reflow = true
# Enable structured confirmation prompts in Default mode.
default_mode_request_user_input = true

[agents]
max_threads = 6
max_depth = 1

[mcp_servers]

[tui]
status_line = ['project-name', 'pull-request-number', 'git-branch', 'task-progress', 'context-used', 'used-tokens', 'context-window-size', 'five-hour-limit', 'weekly-limit', 'model-with-reasoning', 'run-state', 'permissions', 'approval-mode', 'workspace-headline']
status_line_use_colors = true

[tui.model_availability_nux]
'gpt-5.5' = 4
