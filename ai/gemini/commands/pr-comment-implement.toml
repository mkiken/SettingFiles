description = "Implement code changes based on PR review comments, with design review phase before implementation"
prompt = """Implement code changes based on PR review comments for {{args}}.

## Instructions

- First `{{args}}` token is `PR_URL`; the rest is `PROMPT`.
- Fetch context with `run_shell_command`: `gh pr view "$PR_URL" --comments`; it
  resolves the PR from the comment URL.
- Note: Dynamic `gh` / `git` calls will require user confirmation during
  execution (Gemini CLI limitation).
- Ask approvals, target selections, retries, and the final action selection as
  plain-text questions and wait for the user's reply.

## Core Workflow

!{cat ~/.gemini/common/pr_comment_implement_core.md}"""
