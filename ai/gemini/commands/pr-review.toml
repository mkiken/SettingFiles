description = "Comprehensive PR review using gh command for specified PR number"
prompt = """
Perform a comprehensive PR review for {{args}}.

CRITICAL: Run these commands FIRST:
!{gh pr view {{args}} --json number,url,title,author,headRefName,baseRefName,isDraft,mergeable,state,additions,deletions,changedFiles}
!{git branch --show-current}
!{bash ~/.config/ai-pr/bin/fetch_existing_comments.sh {{args}}}
!{bash ~/.config/ai-pr/bin/format_pr_diff_with_line_numbers.sh {{args}}}

`fetch_existing_comments.sh` above outputs existing PR comments as NDJSON — use it for duplicate detection per the Existing Comment Deduplication rules in the core rules below. `format_pr_diff_with_line_numbers.sh` is the authoritative source for review line numbers (see Line Number Source in the core rules).

Via `run_shell_command`:
- PR body: `gh pr view {{args}} --json body --jq '.body'`
- Code changes: `gh pr diff {{args}}` (if too large, redirect to a file, e.g. `gh pr diff {{args}} > diff.txt`, and read it incrementally)
- Changed files only: `gh pr diff {{args}} --name-only`

### Local vs Remote File Access

Compare the `git branch --show-current` output with `headRefName` from the PR metadata above.

**If they match (local mode)** — use local shell commands:
- `grep -n '' path/to/file` — read file contents with stable line numbers
- `find . -type f -name "*.ts"` or `ls -R src/` — explore file structure

**If they don't match (remote mode)** — use gh api:
- `gh api repos/{owner}/{repo}/contents/{path}?ref={headRefName} --jq '.content' | base64 -d | grep -n ''` — read any file with stable line numbers
- `gh api repos/{owner}/{repo}/git/trees/{headRefName}?recursive=1` — explore file structure

### Review Breadth

Review ALL changed files individually, checking ALL 7 quality perspectives defined in the core rules below for each. Do not skip files or categories during analysis, but report only actionable issues with concrete impact and a concrete response. Do not invent findings to satisfy a target count — a clean PR may legitimately have zero findings.

### Core Review Rules

!{cat ~/.gemini/common/pr_review_core.md}

!{cat ~/.gemini/common/pr_review_finding_format.md}

### Post-Review

After completing the review, delete any temporary files created during the process (e.g. `diff.txt`).

If at least one actionable finding remains, display the following message after outputting the review results and cleaning up:

> GitHub PRにレビュー結果を投稿するには、以下を実行してください:
> `/pr-comment-post <項目番号>` (例: `/pr-comment-post 1 3 5`)
"""
