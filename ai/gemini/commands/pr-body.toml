description = "Generate comprehensive PR body content using gh command for specified PR number"
prompt = """Generate a comprehensive PR body. In the rules below, `<PR_NUMBER>` refers to {{args}}; if {{args}} is empty, resolve the current branch's PR number with `gh pr view --json number --jq .number` and use that; if that fails, ask the user for the PR number.
For every user confirmation, use the `ask_user` tool.

CRITICAL: Run these commands FIRST:
!{gh pr view {{args}} --json number,url,title,body,author,headRefName,baseRefName}
!{cat .github/PULL_REQUEST_TEMPLATE.md 2>/dev/null || echo "NO_TEMPLATE"}

To see the code changes, run `gh pr diff {{args}}` with your `run_shell_command` tool.

If the second command output above is "NO_TEMPLATE", `.github/PULL_REQUEST_TEMPLATE.md` does not exist.

!{cat ~/.gemini/common/pr_body_core.md}

!{cat ~/.gemini/common/pr_body_format.md}"""
