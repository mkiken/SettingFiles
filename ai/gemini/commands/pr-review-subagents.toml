description = "Review a PR with seven parallel specialist agents. Expects [prNumber] [additionalInstructions...]."

prompt = """
Review the target PR with seven specialist agents in parallel. Respond in Japanese.

Inputs: parse `{{args}}` as `[prNumber] [additionalInstructions...]`. If the first token is a PR number (`123` or `#123`) or PR URL, use it as `<PR_NUMBER>` and treat the rest as `<ADDITIONAL_INSTRUCTIONS>`. Otherwise, resolve the current branch's PR with `gh pr view --json number --jq .number` and treat all arguments as `<ADDITIONAL_INSTRUCTIONS>`.

Use only `<PR_NUMBER>` in gh commands. If `<ADDITIONAL_INSTRUCTIONS>` is non-empty, pass it to every specialist agent and apply it as review emphasis without overriding mandatory duplicate detection, line-number, safety, or output-format rules.

## Gather Once

Run with `run_shell_command`:

```bash
gh pr view <PR_NUMBER> --json title,body,baseRefName,baseRefOid,headRefName,headRefOid,url,files,commits
gh pr diff <PR_NUMBER>
bash ~/.config/ai-pr/bin/format_pr_diff_with_line_numbers.sh <PR_NUMBER>
gh repo view --json nameWithOwner
git branch --show-current
git rev-parse HEAD
bash ~/.config/ai-pr/bin/fetch_existing_comments.sh <PR_NUMBER>
```

Local mode requires the current branch to match `headRefName`, local HEAD to match `headRefOid`, and `git cat-file -e <baseRefOid>^{commit}` to succeed. Otherwise use remote mode and inspect `headRefOid`, never local files.

Capture the full and line-numbered diffs through the configured large-output path, using source labels unique to the PR and `headRefOid`. Count the line-numbered diff before expanding it in the parent context.

Derive a compact manifest for every top-level inline thread (`kind=inline` and `in_reply_to_id=null`) with `id`, `path`, `line`, `start_line`, `is_resolved`, `is_outdated`, `thread_id`, `ai_origin`, and a concise root-cause/fix excerpt. Keep the full NDJSON in the parent for final aggregation.

## Launch Agents

Pass each agent directly: PR number, metadata, repo owner/name, the compact comment manifest, local mode, base/head names, `baseRefOid`, `headRefOid`, and `<ADDITIONAL_INSTRUCTIONS>`. For a line-numbered diff of at most 100 lines, also pass both diffs directly. For a larger diff, do not paste either full payload; pass the changed-file list and captured source labels instead. Every agent must inspect every changed file and its relevant diff at the exact PR revisions (local mode: local head file plus `git diff <baseRefOid>...<headRefOid>`; remote mode: `gh api` contents at `headRefOid` plus the PR-files patch). Indexed snippets alone are insufficient. Do not refetch the whole PR diff or make duplicate detection depend only on an indexed source. Each agent's focus and review rules are in its definition.

Invoke all seven with `wait_for_previous=false`:

1. **pr-reviewer-bugs** — バグ検出・ロジックエラー・エラーハンドリング
2. **pr-reviewer-security** — セキュリティ脆弱性
3. **pr-reviewer-design** — 設計品質（アーキテクチャ・一貫性・簡素化）
4. **pr-reviewer-history** — Git履歴・リグレッションリスク
5. **pr-reviewer-tests** — テスト品質・カバレッジ
6. **pr-reviewer-performance** — パフォーマンス
7. **pr-reviewer-claims** — 主張検証（PR説明・コミットメッセージと実装の乖離）

For the adversarial verification stage in the core below, the verifier agent is **pr-review-verifier**: invoke it once with `wait_for_previous=true` and exactly the payload the core specifies, only when High findings exist.

!{cat ~/.gemini/common/pr_review_subagents/orchestrator_core.md}

!{cat ~/.gemini/common/pr_review_finding_format.md}

If at least one actionable finding remains, append:

> To post any findings as GitHub PR comments, run:
> `/pr-comment-post <item numbers>` (e.g., `/pr-comment-post 1 3 5`)
"""
