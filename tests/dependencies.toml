  "tests/shell/tmux/test_ai_notification_summary_sh.py",
  "tests/shell/tmux/test_claude_transcript_analyze.py",
  "tests/shell/tmux/test_gemini_transcript_summary_jq.py",
]
# Herdr status tests source the live script and its shared tmux modules.
