# Record exceptional dependencies supported by the implementation and tests.
[extra_tests]
# Herdr setup tests source these shell startup components directly.
"shell/zsh/auto_multiplexer.zsh" = ["tests/mac/scripts/test_herdr_sh__herdr_setup.py"]
"shell/zsh/filter/base.zsh" = ["tests/mac/scripts/test_herdr_sh__herdr_setup.py"]
"shell/zsh/plugin.zsh" = ["tests/mac/scripts/test_herdr_sh__herdr_setup.py"]
# These tests source the real notification helpers in their shell commands.
