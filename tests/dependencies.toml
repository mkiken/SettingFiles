# Add only dependencies proven by a wider test run after targeted testing missed them.
[extra_tests]
# herdr_wait_shell_ready.sh は ai.zsh と herdr-split-snapshot-pane.sh から source される
# 共有関数で、テストはその両呼び出し元側にある。helper 単体をパスに渡すと
# tests/shell/tmux/test_herdr_wait_shell_ready_sh.py を探して0件になるため明示する。
"shell/tmux/herdr_wait_shell_ready.sh" = [
  "tests/shell/zsh/alias/ai/test_ai_zsh__herdr_run_in_new_tab.py",
  "tests/shell/tmux/test_herdr_split_snapshot_pane_sh.py",
]

# config-audit のアダプタ3種は orchestrator_core.md との契約テストで検証される
# (RUN_DIR / platform_key / allowed-tools / scratchpad例外の撤去)。
# アダプタ側の命名では test_..._sh.py 相当が存在せず0件になるため明示する。
"ai/claude/skills/config-audit/SKILL.md" = [
  "tests/ai/common/config_audit_subagents/test_orchestrator_core_md__audit_report_contract.py",
]
"ai/codex/skills/config-audit/skill_head.md" = [
  "tests/ai/common/config_audit_subagents/test_orchestrator_core_md__audit_report_contract.py",
]
"ai/gemini/commands/config-audit.toml" = [
  "tests/ai/common/config_audit_subagents/test_orchestrator_core_md__audit_report_contract.py",
]

# _gh_compare_url_build は gh.zsh にあるが、テストはエントリポイントの fgh-compare
# (github.zsh) 側にまとめている。gh.zsh 単独変更では
# tests/shell/zsh/alias/test_gh_zsh.py を探して0件になるため明示する。
"shell/zsh/alias/gh.zsh" = [
  "tests/shell/zsh/filter/test_github_zsh__compare_url_picker.py",
]

# mac/initialize / mac/initialization/initialize / mac/update の共通引数パースは
# 3ファイル横断の1テストで検証する。テストは mac/update 側に置いているため、
# 他2ファイル単独の変更では 0 件になる。
"mac/initialization/initialize" = [
  "tests/mac/test_update__common_args.py",
]
"mac/initialize" = [
  "tests/mac/test_update__common_args.py",
]
